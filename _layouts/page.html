---
layout: default
---
<div class="wrap">
  <header class="page-head">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="page-head__lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="page-body">
{{ content }}
  </div>
</div>
