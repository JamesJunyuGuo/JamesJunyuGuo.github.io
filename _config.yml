# Site settings — edit these, then commit and push. GitHub Pages rebuilds the site.
title: "Junyu Guo"
description: "Junyu (James) Guo is a Ph.D. candidate at UC Berkeley working on reinforcement learning, LLM reasoning and trustworthy AI."
url: "https://jamesjunyuguo.github.io"
baseurl: ""
locale: "en-US"
timezone: America/Los_Angeles

author:
  name: "Junyu Guo"
  full_name: "Junyu (James) Guo"
  role: "Ph.D. candidate"
  affiliation: "University of California, Berkeley"
  location: "Berkeley, CA"
  avatar: "/images/profile.jpg"
  cv: "/assets/CV_Junyu_Guo.pdf"
  email: "guojyjames@gmail.com"
  email_alt: "junyuguo24@berkeley.edu"
  twitter: "james_junyuguo"
  linkedin: "junyuguo-james"
  googlescholar: ""   # paste your Google Scholar profile URL to show the icon

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  math_engine: mathjax
permalink: /:categories/:title/
excerpt_separator: "\n\n"
future: false

collections:
  portfolio:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, kind: "Blog" }
  - scope: { path: "", type: portfolio }
    values: { layout: post, kind: "Note", math: true }
  - scope: { path: "", type: pages }
    values: { layout: page }

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
