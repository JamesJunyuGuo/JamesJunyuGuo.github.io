- title: "Safe & Efficient Reinforcement Learning"
  text: "Offline and constrained RL that keeps policies safe without giving up reward or inference speed, and algorithms that adapt quickly to changing environments."
- title: "LLM Reasoning & Uncertainty"
  text: "How language models should choose a reasoning style, say what they are unsure about, and keep track of information that changes within a conversation."
- title: "Trustworthy AI Agents"
  text: "Checks that let weaker reviewers audit stronger agents, from coding agents to decision-making systems, so that AI remains verifiable, fair and privacy-preserving as it scales."
