- title: "Groundability, Not Scale Alone: When Weak Reviewers Can Audit Strong Coding Agents"
  authors: "Junyu Guo, Shangding Gu, Ming Jin, Javad Lavaei"
  venue: "Preprint"
  year: 2026
  topic: "LLM agents"
  selected: true
  summary: "Coding agents often return patches that look right but omit required behavior. We ask when a nominally weaker model can reliably judge whether such a patch solves its issue. Across 411 execution-labeled traces, organizing the evidence better is not enough: what matters is groundability, whether an independent check such as a runnable test can settle the disputed claim. Given such evidence, five of six reviewers catch more defects while over-rejecting less, and parameter count does not predict review quality."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2610.01023"

- title: "When Context Changes: Understanding Update Failures in LLMs"
  authors: "Junyu Guo, Yuchen Fang, Shangding Gu, Costas Spanos, James Demmel, Javad Lavaei"
  venue: "Preprint"
  year: 2026
  topic: "LLM reasoning"
  selected: true
  summary: "Even when the updated value of a variable is right there in the context, LLM agents often answer with the old one. We name this failure stale binding, build the Controlled In-Context Memory (CICM) benchmark to isolate it, and trace it to attention drifting back toward outdated values. Redirecting that attention at inference time, with no further training, removes most of the errors."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2609.38866"

- title: "LLMs Should Express Uncertainty Explicitly"
  authors: "Junyu Guo, Shangding Gu, Ming Jin, Costas Spanos, Javad Lavaei"
  venue: "Preprint"
  year: 2026
  topic: "LLM reasoning"
  selected: true
  summary: "A model that sounds equally confident when right and wrong is hard to build on. We train LLMs to express uncertainty in two complementary ways: explicit uncertainty markers while they reason, and a verbalized confidence score once they finish. This cuts overconfident errors and gives downstream systems such as retrieval-augmented generation a signal they can act on."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2604.05306"

- title: "Don't Trade Off Safety: Diffusion Regularization for Constrained Offline RL"
  authors: "Junyu Guo, Zhi Zheng, Donghao Ying, Ming Jin, Shangding Gu, Costas Spanos, Javad Lavaei"
  venue: "NeurIPS"
  year: 2025
  topic: "Safe RL"
  selected: true
  summary: "Offline safe RL usually pays for safety with either reward or inference speed. DRCORL uses a diffusion model only as a regularizer, so the learned policy stays simple and fast at inference, and resolves conflicts between reward and safety objectives through gradient manipulation. The result keeps both safety and performance."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2502.12391"
    - label: "NeurIPS"
      url: "https://neurips.cc/virtual/2025/poster/116918"

- title: "Meta Thinker: Thinking What AI Thinks"
  authors: "Junyu Guo, Shangding Gu, Costas J. Spanos, Javad Lavaei"
  venue: "NeurIPS MATH-AI Workshop"
  year: 2025
  topic: "LLM reasoning"
  selected: true
  summary: "No single reasoning style wins everywhere. After comparing five reasoning paradigms across mathematical, logical and commonsense benchmarks, we propose a meta-thinking prompting algorithm that lets the model choose, or synthesize, a style suited to each input. It raises accuracy while using fewer tokens than committing to one style in advance."
  links:
    - label: "OpenReview"
      url: "https://openreview.net/forum?id=JiMvrQsZde"
    - label: "Poster page"
      url: "https://neurips.cc/virtual/2025/loc/san-diego/131140"
    - label: "Code"
      url: "https://github.com/JamesJunyuGuo/meta_thinker_LLM"

- title: "StyleBench: Evaluating Thinking Styles in Large Language Models"
  authors: "Junyu Guo, Shangding Gu, Ming Jin, Costas Spanos, Javad Lavaei"
  venue: "Preprint"
  year: 2025
  topic: "LLM reasoning"
  selected: true
  summary: "Structured reasoning is not free. StyleBench evaluates five reasoning strategies across diverse tasks and model scales, mapping where structure genuinely helps and where it only adds tokens or introduces new failure modes. The results are a practical guide for matching reasoning style to task and model size."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2509.20868"
    - label: "Code"
      url: "https://github.com/JamesJunyuGuo/Style_Bench"

- title: "Reinforcement Learning for SBM Graphon Games with Re-Sampling"
  authors: "Peihan Huo, Oscar Peralta, Junyu Guo, Qiaomin Xie, Andreea Minca"
  venue: "Preprint"
  year: 2023
  topic: "Mean field games"
  summary: "Extends mean field games to populations connected through a stochastic block model graphon, and gives a reinforcement learning algorithm with re-sampling that comes with convergence guarantees. Experiments on an epidemic model illustrate the approach."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2310.16326"
