- title: "Groundability, Not Scale Alone: When Weak Reviewers Can Audit Strong Coding Agents"
  authors: "Junyu Guo, Shangding Gu, Ming Jin, Javad Lavaei"
  venue: "Preprint"
  year: 2026
  topic: "LLM agents"
  selected: true
  summary: "Can a weaker model reliably decide whether a strong coding agent's patch actually solves its issue? Longer traces, more context and better-organized evidence do not make the judgment reliable. What does is groundability: whether an independent check, such as a runnable test or sound static analysis, can answer the disputed question. Given groundable evidence, weak reviewers catch the omissions that confident summaries hide, and reviewer size stops predicting quality. The open problem is producing such checks when official tests are not available."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2610.01023"

- title: "When Context Changes: Understanding Update Failures in LLMs"
  authors: "Junyu Guo, Yuchen Fang, Shangding Gu, Costas Spanos, James Demmel, Javad Lavaei"
  venue: "Preprint"
  year: 2026
  topic: "LLM reasoning"
  selected: true
  summary: "LLMs can answer with an old value of a variable even when the updated one is still in context, a failure we call stale binding. We introduce the Controlled In-Context Memory (CICM) benchmark to isolate it and trace it to attention drift: when attention scores are similar, several old values together outweigh the current one. Redirecting attention toward the current value at inference time, with no further training, corrects most of these errors."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2609.38866"

- title: "LLMs Should Express Uncertainty Explicitly"
  authors: "Junyu Guo, Shangding Gu, Ming Jin, Costas Spanos, Javad Lavaei"
  venue: "Preprint"
  year: 2026
  topic: "LLM reasoning"
  selected: true
  summary: "LLMs often give confident but wrong answers. We show that post-training can make a model's self-assessment explicit in its own response, and ask where that signal belongs: a verbalized confidence score once the answer is formed, or an uncertainty marker emitted mid-reasoning whenever the current step looks unreliable. Both sharply reduce overconfident errors while improving answer quality, through different mechanisms: the first sharpens a confidence structure already present in the pretrained model, the second teaches the model to flag high-risk reasoning steps."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2604.05306"

- title: "Don't Trade Off Safety: Diffusion Regularization for Constrained Offline RL"
  authors: "Junyu Guo, Zhi Zheng, Donghao Ying, Ming Jin, Shangding Gu, Costas Spanos, Javad Lavaei"
  venue: "NeurIPS"
  year: 2025
  topic: "Safe RL"
  selected: true
  summary: "Constrained offline RL must learn safe, high-reward policies from a fixed dataset, with no unsafe exploration. DRCORL uses a diffusion model to capture the behavior policy in the data, distills it into a simple policy for fast inference, and applies gradient manipulation to balance reward against constraint satisfaction. The result reliably meets cost limits without giving up return or inference speed, and does so with the same hyperparameters across tasks."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2502.12391"
    - label: "NeurIPS"
      url: "https://neurips.cc/virtual/2025/poster/116918"

- title: "Meta Thinker: Thinking What AI Thinks"
  authors: "Junyu Guo, Shangding Gu, Costas J. Spanos, Javad Lavaei"
  venue: "NeurIPS MATH-AI Workshop"
  year: 2025
  topic: "LLM reasoning"
  selected: true
  summary: "Reasoning strategies such as Chain-of-Thought and Tree-of-Thought help, but which one works depends on the problem. We ask whether an LLM can pick its own thinking style. After analyzing five reasoning paradigms across mathematical, logical and commonsense tasks, we propose a meta-thinking prompt algorithm that lets the model select, or synthesize, a reasoning style from the input itself, improving both accuracy and token efficiency."
  links:
    - label: "OpenReview"
      url: "https://openreview.net/forum?id=JiMvrQsZde"
    - label: "Poster page"
      url: "https://neurips.cc/virtual/2025/loc/san-diego/131140"
    - label: "Code"
      url: "https://github.com/JamesJunyuGuo/meta_thinker_LLM"

- title: "StyleBench: Evaluating Thinking Styles in Large Language Models"
  authors: "Junyu Guo, Shangding Gu, Ming Jin, Costas Spanos, Javad Lavaei"
  venue: "Preprint"
  year: 2025
  topic: "LLM reasoning"
  selected: true
  summary: "How well a reasoning style works depends on the model and the task, yet this interplay was poorly understood. StyleBench systematically evaluates five styles of thought across diverse tasks and open-source models of many sizes. The takeaway: no single style is universally best. Search-based styles pay off on open-ended problems but need large models, concise styles bring large efficiency gains on well-defined tasks, and small models often ignore the format and guess. Robust reasoning emerges with scale."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2509.20868"
    - label: "Code"
      url: "https://github.com/JamesJunyuGuo/Style_Bench"

- title: "Reinforcement Learning for SBM Graphon Games with Re-Sampling"
  authors: "Peihan Huo, Oscar Peralta, Junyu Guo, Qiaomin Xie, Andreea Minca"
  venue: "Preprint"
  year: 2023
  topic: "Mean field games"
  summary: "Mean-field approximations assume homogeneous, fully connected populations, which rarely holds in practice. We study multi-population mean field games whose connections follow a stochastic block model, and handle the realistic case where that block structure is unknown by re-sampling agents from a graphon. The resulting Graphon Game with Re-Sampling model provably converges to the multi-population dynamics, and comes with a sample-based reinforcement learning algorithm that has finite-sample guarantees."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2310.16326"
